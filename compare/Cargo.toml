[package]
name = "meridian-compare"
version = "0.1.0"
edition = "2024"
publish = false
description = "Head-to-head comparison of Meridian's routing analysis against shahrah's, on one machine."

[dependencies]
meridian-core = { path = "../crates/meridian-core" }
meridian-sql = { path = "../crates/meridian-sql" }
shahrah-sql = { git = "https://github.com/rs-alireza/shahrah", rev = "ac057a6c7bf45395f33e74ff47d61486bd03ddfb" }

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }

[[bench]]
name = "head_to_head"
harness = false
