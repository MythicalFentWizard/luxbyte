[package]
name = "luxbyte-compare"
version = "0.1.0"
edition = "2024"
publish = false
description = "Head-to-head comparison of Luxbyte's routing analysis against shahrah's, on one machine."

[dependencies]
luxbyte-core = { path = "../crates/luxbyte-core" }
luxbyte-sql = { path = "../crates/luxbyte-sql" }
shahrah-sql = { git = "https://github.com/rs-alireza/shahrah", rev = "ac057a6c7bf45395f33e74ff47d61486bd03ddfb" }

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }

[[bench]]
name = "head_to_head"
harness = false
