# A three-region deployment. Start it with:
#   luxbyte serve --config examples/luxbyte.toml

[server]
listen = "127.0.0.1:6432"
# Unique per proxy: it goes into every PREPARE TRANSACTION identifier and is
# what stops two proxies resolving each other's in-doubt transactions.
node = "eu-proxy-1"
# Where commit decisions are written. Without it, a crash between prepare and
# commit leaves prepared transactions for an operator to resolve by hand.
commit_log = "./commit-log"

[backend]
user = "postgres"
database = "shop"
# password = "..."
# libpq's sslmode names. prefer encrypts when the server offers it;
# verify-full is what stops a man in the middle.
tls = "prefer"
# tls_ca_file = "/etc/luxbyte/backend-ca.pem"

# TLS to clients. Without a certificate, clients that ask are declined.
# [tls]
# cert_file = "/etc/luxbyte/server.pem"
# key_file = "/etc/luxbyte/server.key"
# required = true

# Probing backends. A replica further behind than this serves no reads, and
# a session's reads wait for a replica that has replayed its writes.
[health]
interval_ms = 2000
timeout_ms = 2000
max_replica_lag_bytes = 16777216

[pool]
max_size = 16
# Connections are shared between clients, so one that ran a SET, LISTEN or
# PREPARE is reset before reuse, in the background. "always" also catches
# temporary tables, at the cost of a reset on every return.
reset = "when_changed"
reset_query = "DISCARD ALL"

# Clients authenticate with SCRAM-SHA-256 against PostgreSQL's own stored
# verifiers. With nothing here the proxy trusts every client, and refuses to
# listen anywhere but loopback unless method = "trust" says so on purpose.
[auth]
# Read a role's verifier from the home region's primary. A SECURITY DEFINER
# function over pg_authid lets the backend role do this without superuser.
query = "SELECT rolpassword FROM pg_authid WHERE rolname = $1"
# Log in to backends as the client's own role, with the keys its login
# proved, so GRANTs and row-level security still apply. The role needs the
# same verifier in every region.
passthrough = true

# Or keep verifiers here, copied from pg_authid.rolpassword:
# [[auth.users]]
# name = "app"
# verifier = "SCRAM-SHA-256$4096:<salt>$<StoredKey>:<ServerKey>"

# Prometheus metrics, a JSON snapshot, key lookup and a dashboard. Off unless
# listen is set; refuses to listen beyond loopback without a password.
[admin]
listen = "127.0.0.1:9187"
# password_env = "LUXBYTE_ADMIN_PASSWORD"
# Serve HTTPS with the [tls] certificate.
# tls = true

# Keep the directory in a table in every region, and allow RELOCATE. A move
# changes the directory in the same transaction as the rows it moves. Takes
# the place of the [[directory]] entries at the end of this file.
# [directory_store]
# table = "luxbyte_directory"
# Roles allowed to run RELOCATE; they must authenticate.
# operators = ["ops"]
# How long a statement waits for a moving key before 40001.
# hold_ms = 10000
# How long a move waits for writes under way and for its locks.
# lock_timeout_ms = 5000

[topology]
home_region = "eu-west"

[[topology.regions]]
id = "eu-west"
primary = { host = "eu.db.internal" }
replicas = [{ host = "eu-replica.db.internal" }]

[[topology.regions]]
id = "us-east"
primary = { host = "us.db.internal" }

[[topology.regions]]
id = "ap-south"
primary = { host = "ap.db.internal" }

[[topology.tables]]
table = "users"
placement = "geo_partitioned"
key = "tenant_id"

[[topology.tables]]
table = "currencies"
placement = "global_replicated"

# Keys already placed, for a proxy without a [directory_store]. A key with no
# entry is written in the home region and read from every region.
[[directory]]
table = "users"
key = "alice"
region = "eu-west"
