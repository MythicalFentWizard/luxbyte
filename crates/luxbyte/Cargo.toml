[package]
name = "luxbyte"
description = "A geo-distributed PostgreSQL proxy for multi-region Postgres: routes every statement to the region that holds the data, with sharding, data residency, connection pooling and two-phase commit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["postgresql", "proxy", "multi-region", "sharding", "geo-distributed"]
categories = ["database", "network-programming", "command-line-utilities"]
default-run = "luxbyte"

[features]
default = ["pg-parser"]
# PostgreSQL's own parser behind sqlparser: see luxbyte-sql.
pg-parser = ["luxbyte-sql/pg-parser"]

[dependencies]
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
bytes.workspace = true
futures-util.workspace = true
luxbyte-core.workspace = true
luxbyte-pool.workspace = true
luxbyte-proto.workspace = true
luxbyte-sql.workspace = true
sqlparser.workspace = true
luxbyte-txn.workspace = true
parking_lot.workspace = true
rand.workspace = true
sha2.workspace = true
subtle.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
luxbyte-testkit.workspace = true
luxbyte-pool.workspace = true
criterion = { workspace = true, features = ["async_tokio"] }

[[bench]]
name = "proxy"
harness = false

[lints]
workspace = true
