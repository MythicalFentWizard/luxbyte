[package]
name = "luxbyte"
description = "A geo-distributed PostgreSQL proxy: routes every statement to the region that holds the data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
default-run = "luxbyte"

[dependencies]
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
bytes.workspace = true
futures-util.workspace = true
luxbyte-core.workspace = true
luxbyte-pool.workspace = true
luxbyte-proto.workspace = true
luxbyte-sql.workspace = true
sqlparser.workspace = true
luxbyte-txn.workspace = true
parking_lot.workspace = true
rand.workspace = true
sha2.workspace = true
subtle.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
luxbyte-testkit.workspace = true
luxbyte-pool.workspace = true
criterion = { workspace = true, features = ["async_tokio"] }

[[bench]]
name = "proxy"
harness = false

[lints]
workspace = true
